<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>数据公布历史</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7; color: #1f2937; min-height: 100vh;
  }
  .header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #fff; padding: 14px 16px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .header h1 { font-size: 18px; font-weight: 700; text-align: center; }
  .header .sub { font-size: 11px; text-align: center; opacity: .85; margin-top: 2px; }
  .tabs { display: flex; gap: 8px; margin-top: 12px; }
  .tabs button {
    flex: 1; padding: 9px 0; border: none; border-radius: 10px 10px 0 0;
    background: rgba(255,255,255,.18); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  .tabs button.active { background: #f4f5f7; color: #b45309; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 12px 40px; }

  /* 最新一期 */
  .latest {
    background: #fff; border-radius: 12px; padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 12px;
    border-top: 3px solid #d97706;
  }
  .latest .meta { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .latest .period { font-size: 16px; font-weight: 700; color: #b45309; }
  .latest .date { font-size: 12px; color: #6b7280; }
  .latest .balls { display: flex; gap: 6px; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #6b7280; }
  .legend span { display: flex; align-items: center; gap: 4px; }

  /* 列表 */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .toolbar select {
    border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 10px;
    font-size: 13px; color: #374151; background: #fff; outline: none;
  }
  .toolbar .count { font-size: 12px; color: #9ca3af; }
  .list { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid #f3f4f6;
  }
  .row:last-child { border-bottom: none; }
  .row .no { width: 62px; font-weight: 700; font-size: 14px; color: #374151; flex-shrink: 0; }
  .row .dt { width: 82px; font-size: 11px; color: #9ca3af; flex-shrink: 0; }
  .row .balls { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .year-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #fafafb;
    font-size: 13px; font-weight: 700; color: #b45309;
    border-bottom: 1px solid #f3f4f6; border-left: 3px solid #d97706;
  }

  /* 号码球 */
  .ball {
    position: relative; width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0;
  }
  .ball .zod { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: #6b7280; font-weight: 600; white-space: nowrap; }
  .ball.special { border: 2px solid #d97706; box-shadow: 0 0 0 2px #fde68a; }
  .ball.special::after {
    content: '特'; position: absolute; top: -6px; right: -6px;
    background: #d97706; color: #fff; font-size: 8px; font-weight: 700;
    border-radius: 6px; padding: 1px 4px;
  }
  .ball.b-red { background: #dc2626; }
  .ball.b-green { background: #16a34a; }
  .ball.b-blue { background: #2563eb; }
  .latest .ball { width: 44px; height: 44px; font-size: 17px; }

  #loadMore {
    display: block; width: 100%; margin-top: 12px; padding: 11px 0;
    border: none; border-radius: 10px; background: #fff; color: #b45309;
    font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  #loadMore:disabled { color: #9ca3af; cursor: default; }

  .empty, .error { text-align: center; padding: 48px 20px; color: #9ca3af; font-size: 14px; }
  .loading { text-align: center; padding: 30px; color: #b45309; font-size: 14px; }

  @media (max-width: 420px) {
    .row .no { width: 54px; font-size: 13px; }
    .row .dt { width: 74px; font-size: 10px; }
    .ball { width: 32px; height: 32px; font-size: 12px; }
    .latest .ball { width: 40px; height: 40px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>数据公布历史</h1>
  <div class="sub">仅作数据整理分析，不构成任何建议</div>
  <nav class="tabs">
    <button data-type="mo" class="active">澳门</button>
    <button data-type="hk">香港</button>
  </nav>
</div>

<div class="wrap">
  <!-- 最新一期 -->
  <section class="latest" id="latestBox" style="display:none">
    <div class="meta">
      <span class="period" id="latestPeriod">—</span>
      <span class="date" id="latestDate">—</span>
    </div>
    <div class="balls" id="latestBalls"></div>
    <div class="legend">
      <span><i class="ball b-red" style="width:14px;height:14px;font-size:0"></i>红波</span>
      <span><i class="ball b-green" style="width:14px;height:14px;font-size:0"></i>绿波</span>
      <span><i class="ball b-blue" style="width:14px;height:14px;font-size:0"></i>蓝波</span>
      <span><i class="ball b-blue special" style="width:14px;height:14px;font-size:0"></i>特号</span>
    </div>
  </section>

  <!-- 筛选 -->
  <div class="toolbar">
    <select id="yearSel"><option value="">全部年份</option></select>
    <span class="count" id="countText">共 0 期</span>
  </div>

  <!-- 列表 -->
  <div id="status"></div>
  <div class="list" id="list"></div>
  <button id="loadMore" style="display:none">加载更多</button>
</div>

<script>
(function () {
  // ── 常量 ──
  var RED = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
  var GREEN = new Set([5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49]);
  // 2026 马年基准：1,13,25,37,49 属马，按 12 轮换
  var ZODIAC = ['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'];
  var API = { mo: '/api/periods/mo/results', hk: '/api/periods/hk/results' };
  var PAGE_SIZE = 50;

  // ── 状态 ──
  var current = 'mo';
  var all = [];       // 全部数据（当前地区，当前年份过滤后）
  var shown = 0;

  var $ = function (id) { return document.getElementById(id); };
  var tabs = document.querySelectorAll('.tabs button');

  function zodiacOf(n) { return ZODIAC[(Number(n) - 1) % 12]; }
  function ballColor(n) {
    n = Number(n);
    if (RED.has(n)) return 'b-red';
    if (GREEN.has(n)) return 'b-green';
    return 'b-blue';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  // 生成单个号码球
  function ballHTML(n, isSpecial) {
    var num = Number(n);
    return '<span class="ball ' + ballColor(num) + (isSpecial ? ' special' : '') + '" title="' +
      esc(num) + ' ' + esc(zodiacOf(num)) + '">' + num +
      '<span class="zod">' + esc(zodiacOf(num)) + '</span></span>';
  }

  // ── 数据加载 ──
  function fetchData(type) {
    return fetch(API[type]).then(function (r) { return r.json(); });
  }

  function renderLatest() {
    var latest = all[0];
    if (!latest) { $('latestBox').style.display = 'none'; return; }
    $('latestBox').style.display = '';
    $('latestPeriod').textContent = latest.period_no + '期';
    $('latestDate').textContent = latest.draw_date || '';
    var nums = numsOf(latest);
    $('latestBalls').innerHTML = nums.map(function (n, i) {
      return ballHTML(n, i === 6);
    }).join('');
  }

  function numsOf(r) {
    return [r.n1, r.n2, r.n3, r.n4, r.n5, r.n6, r.special];
  }

  function renderList() {
    var listEl = $('list');
    var visible = all.slice(0, shown);
    if (visible.length === 0) {
      listEl.innerHTML = '';
      $('status').innerHTML = '<div class="empty">暂无数据公布，请稍后同步</div>';
      $('loadMore').style.display = 'none';
      return;
    }
    $('status').innerHTML = '';
    // 按年归类（visible 已按 period_no 倒序，年份自然从新到旧）
    var groups = {};
    visible.forEach(function (r) {
      var y = String(r.period_no).slice(0, 4) || '其他';
      (groups[y] = groups[y] || []).push(r);
    });
    listEl.innerHTML = Object.keys(groups).sort(function (a, b) {
      return Number(b) - Number(a);
    }).map(function (y) {
      var rows = groups[y].map(function (r) {
        var nums = numsOf(r);
        var balls = nums.map(function (n, i) { return ballHTML(n, i === 6); }).join('');
        return '<div class="row">' +
          '<span class="no">' + esc(r.period_no) + '</span>' +
          '<span class="dt">' + esc(r.draw_date || '') + '</span>' +
          '<span class="balls">' + balls + '</span>' +
          '</div>';
      }).join('');
      return '<div class="year-head">' + y + ' 年（' + groups[y].length + ' 期）</div>' + rows;
    }).join('');
    $('loadMore').style.display = shown < all.length ? '' : 'none';
    $('loadMore').textContent = shown < all.length ? ('加载更多（' + all.length + ' 期）') : '已全部加载';
  }

  function renderYearSel() {
    var years = {};
    all.forEach(function (r) {
      var y = String(r.period_no).slice(0, 4);
      if (y) years[y] = 1;
    });
    var keys = Object.keys(years).sort().reverse();
    var sel = $('yearSel');
    var cur = sel.value;
    sel.innerHTML = '<option value="">全部年份</option>' + keys.map(function (y) {
      return '<option value="' + y + '">' + y + '</option>';
    }).join('');
    sel.value = cur;
  }

  function applyFilter() {
    var year = $('yearSel').value;
    if (year) {
      var filtered = [];
      for (var i = 0; i < all.length; i++) {
        if (String(all[i].period_no).startsWith(year)) filtered.push(all[i]);
      }
      all = filtered;
    }
    shown = Math.min(PAGE_SIZE, all.length);
    $('countText').textContent = '共 ' + all.length + ' 期';
    renderLatest();
    renderList();
  }

  function load(type) {
    current = type;
    $('status').innerHTML = '<div class="loading">数据加载中…</div>';
    $('list').innerHTML = '';
    fetchData(type).then(function (body) {
      if (body.code !== 0 || !Array.isArray(body.data)) throw new Error(body.message || '数据异常');
      all = body.data.slice(); // 接口已按 period_no 倒序
      renderYearSel();
      applyFilter();
    }).catch(function (e) {
      $('status').innerHTML = '<div class="error">加载失败：' + esc(e.message) + '，请稍后重试</div>';
      $('loadMore').style.display = 'none';
    });
  }

  // ── 事件 ──
  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabs.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      $('yearSel').value = '';
      load(btn.getAttribute('data-type'));
    });
  });
  $('yearSel').addEventListener('change', function () {
    // 需要先恢复全量再过滤
    loadAll(current);
  });
  function loadAll(type) {
    fetchData(type).then(function (body) {
      if (body.code !== 0 || !Array.isArray(body.data)) throw new Error(body.message || '数据异常');
      all = body.data.slice();
      renderYearSel();
      applyFilter();
    }).catch(function (e) {
      $('status').innerHTML = '<div class="error">加载失败：' + esc(e.message) + '</div>';
    });
  }
  $('loadMore').addEventListener('click', function () {
    shown += PAGE_SIZE;
    renderList();
  });

  // ── 启动 ──
  load('mo');
})();
</script>
</body>
</html>
